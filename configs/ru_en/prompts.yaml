# ============================================================
# SwitchLingua 2.0 — Prompt Templates for ru-en
# All templates use {l1_name}, {l2_name}, {domain_context},
# {persona}, {proficiency} as placeholders.
# ============================================================

role_template: "Ты — {persona}. {proficiency}"

# ------------------------------------------------------------
# CS Behavior Templates (Archetype-specific)
# ------------------------------------------------------------
cs_behavior_templates:

  ARC_01: |
    Твои речевые привычки:
    - Ты говоришь в основном на {l1_name}, но естественно вставляешь слова и выражения на {l2_name}
    - {domain_context}
    - Твои частые выражения на {l2_name} — это, например, "by the way", "make sense", "no problem" и т.д.
    - Переключения происходят в основном на уровне существительных или именных групп, ты редко переходишь на целое предложение на {l2_name}
    - Не более 3 подряд идущих слов на {l2_name}, никогда целое предложение на {l2_name}
    - Грамматическая структура твоих предложений всегда остаётся на {l1_name}, слова на {l2_name} вставляются в русский синтаксис

  ARC_02: |
    Твои речевые привычки:
    - Ты естественно переключаешься между {l1_name} и {l2_name} в зависимости от темы и контекста
    - {domain_context}
    - Переключения происходят между предложениями или на границах предложений, грамматика в каждом языке полная
    - Ты не переключаешься посреди фразы, а скорее в конце законченной мысли
    - Иногда при цитировании или переформулировании концепции ты сохраняешь исходный язык

  ARC_03: |
    Твои речевые привычки:
    - Смешение {l1_name} и {l2_name} — это твоя естественная манера речи, ты свободно переключаешься между ними внутри одного предложения
    - {domain_context}
    - Твои переключения очень частые, иногда несколько переходов туда-обратно в одном предложении
    - Существительные, глаголы, прилагательные — всё может быть на {l2_name}, не только термины
    - Это не из-за нехватки словарного запаса, это просто твоя повседневная речевая привычка

  ARC_04: |
    Твои речевые привычки:
    - Ты общаешься преимущественно на {l1_name}, но стратегически переключаешься на {l2_name} в определённых местах
    - {domain_context}
    - Ты используешь {l2_name} чтобы: подчеркнуть мысль, процитировать кого-то, пошутить, выразить формальную позицию
    - Твои переключения не случайны, каждое использование {l2_name} имеет чёткую коммуникативную цель
    - Иногда ты используешь {l2_name} чтобы звучать профессиональнее, иногда — для юмористического эффекта

  ARC_05: |
    Твои речевые привычки:
    - Ты говоришь почти исключительно на {l1_name}
    - {l2_name} появляется только при упоминании брендов, имён собственных или когда действительно нет эквивалента на {l1_name}
    - {domain_context}
    - Слова на {l2_name} в твоей речи очень редки, максимум одно-два на абзац
    - Ты никогда не используешь выражения или предложения на {l2_name}, редкие слова на {l2_name} стоят изолированно

  ARC_06: |
    Твои речевые привычки:
    - Твоя манера переключения кодов значительно варьируется в зависимости от собеседника
    - {domain_context}
    - Ты естественно подстраиваешься под речевые привычки своего собеседника
    - Если собеседник активно смешивает {l1_name} и {l2_name}, ты тоже увеличиваешь долю {l2_name}; если он говорит в основном на {l1_name}, ты сокращаешь {l2_name}
    - Эта адаптация — естественная социальная аккомодация, а не осознанное подражание

  ARC_07: |
    Твои речевые привычки:
    - Твой основной язык — {l2_name}, в повседневном общении ты говоришь почти исключительно на {l2_name}
    - {domain_context}
    - Но ты неосознанно вставляешь {l1_name}-междометия и дискурсивные маркеры (например, "блин", "ну", "вот", "короче")
    - Ты можешь использовать {l1_name} для обращений к родственникам (например, "бабушка", "тётя") или культурно-специфических понятий (например, "дача", "борщ", "тоска")
    - Эти фрагменты на {l1_name} встроены в полностью {l2_name} структуру предложений
    - Ты не произносишь полных предложений на {l1_name}, {l1_name} появляется только в позициях междометий, дискурсивных маркеров и культурно-специфических слов

# ------------------------------------------------------------
# Proficiency Descriptions
# ------------------------------------------------------------
proficiency_descriptions:
  продвинутый: "Твой уровень {l2_name} высокий, у тебя богатый словарный запас и ты можешь свободно использовать разнообразные выражения."
  средний: "Твой уровень {l2_name} средний, повседневное общение не вызывает проблем, но сложные выражения могут даваться с трудом."
  начальный: "Твой уровень {l2_name} ограничен, ты знаешь только некоторые базовые распространённые слова."
  почти_как_родной: "Твой уровень {l2_name} почти как у носителя, ты переключаешься между {l1_name} и {l2_name} с абсолютной лёгкостью."

# ------------------------------------------------------------
# Mixing Level Descriptions
# ------------------------------------------------------------
mixing_level_descriptions:
  minimal: "Очень мало {l2_name}, почти всё на {l1_name}. Только названия брендов или непереводимые имена собственные."
  light: "Лёгкое смешение, примерно 1 слово на {l2_name} на 10 слов. В основном существительные и устойчивые выражения."
  moderate: "Умеренное смешение, примерно 1 слово на {l2_name} на 5-6 слов. Существительные, глаголы и прилагательные могут быть на {l2_name}."
  heavy: "Сильное смешение, примерно 1 слово на {l2_name} на 3-4 слова, иногда целые фразы или придаточные предложения на {l2_name}."
  dense: "Очень плотное смешение, {l1_name} и {l2_name} чередуются почти постоянно, с несколькими переключениями в одном предложении."

# ------------------------------------------------------------
# Generation Requirements
# ------------------------------------------------------------
generation_requirements: |
  Требования к генерации:
  - Диалоги должны звучать естественно, как настоящие русско-английские билингвы в их повседневном общении
  - Вставки {l2_name}-лексики должны соответствовать уровню владения {l2_name} и профессиональному контексту персоны
  - Точки переключения должны соблюдать грамматические правила, никаких переключений в неестественных позициях
  - Нельзя смешивать ради смешения, каждое использование {l2_name} должно иметь законное основание
  - Содержание диалога должно быть близко к жизненным сценам и темам соответствующего профиля персоны

# ------------------------------------------------------------
# Example Dialogues (ru-en)
# ------------------------------------------------------------
example_dialogues:
  - "Сегодня на meeting было очень boring, честно говоря. Хочу в кафе посидеть, расслабиться."
  - "Ты пробовал этот новый app? UI design норм, но loading медленный какой-то."
  - "Короче, мне надо deadline сдвинуть, потому что feedback от reviewer ещё не пришёл."
  - "Я смотрю новый сериал на Netflix, plot twists просто crazy какие-то."
  - "На weekend планирую сходить на exhibition, там contemporary art выставляют."
  - "Мой team lead сказал, что наш project на hold поставили, budget порезали."
  - "Вчера была на brunch с подругами, atmosphere была super cozy, recommend однозначно."
