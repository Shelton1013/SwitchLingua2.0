# ------------------------------------------------------------
# Topic Domain Words (de-en)
# ------------------------------------------------------------
topic_domain_words:

  technology:
    general: ["app", "update", "bug", "server", "code", "data", "software", "cloud"]
    tech_profession: ["debug", "deploy", "API", "frontend", "backend", "code review", "sprint", "pull request", "framework"]
    engineering_profession: ["design", "prototype", "testing", "simulation", "performance", "benchmark"]

  academic:
    general: ["paper", "research", "project", "presentation", "deadline", "feedback"]
    academia_profession: ["methodology", "peer review", "dataset", "literature review", "citation", "abstract"]

  work:
    general: ["meeting", "deadline", "email", "schedule", "report", "team", "project", "brief"]
    finance_profession: ["portfolio", "revenue", "ROI", "equity", "compliance", "asset management", "trading"]
    media_profession: ["content", "campaign", "brand", "social media", "pitch", "storytelling", "influencer"]

  daily_life:
    general: ["weekend", "shopping", "plan", "holiday", "birthday"]

  food:
    general: ["restaurant", "menu", "brunch", "dessert", "recipe", "spot"]

  emotion:
    general: ["stress", "mood", "relax", "relationship", "burnout"]

  entertainment:
    general: ["movie", "music", "game", "Netflix", "YouTube", "concert", "podcast", "streaming"]

  travel:
    general: ["hotel", "airport", "flight", "booking", "check-in", "itinerary", "Airbnb"]

  sports:
    general: ["gym", "workout", "fitness", "match", "training", "running"]

  shopping:
    general: ["sale", "discount", "online", "brand", "promotion", "outlet"]


# ------------------------------------------------------------
# Situation Pools
# ------------------------------------------------------------
situation_pools:

  topics:
    - id: "technology"
      label: "Technologie / Informatik"
      L2_affinity: "high"
      weight: 0.15
    - id: "academic"
      label: "Akademisch / Forschung"
      L2_affinity: "high"
      weight: 0.10
    - id: "work"
      label: "Arbeit / Berufsleben"
      L2_affinity: "medium-high"
      weight: 0.18
    - id: "daily_life"
      label: "Alltag"
      L2_affinity: "low"
      weight: 0.15
    - id: "food"
      label: "Essen / Gastronomie"
      L2_affinity: "low"
      weight: 0.08
    - id: "emotion"
      label: "Emotionen / Beziehungen"
      L2_affinity: "low"
      weight: 0.07
    - id: "entertainment"
      label: "Unterhaltung / Kultur"
      L2_affinity: "medium"
      weight: 0.12
    - id: "travel"
      label: "Reisen / Unterwegs"
      L2_affinity: "medium"
      weight: 0.07
    - id: "sports"
      label: "Sport / Fitness"
      L2_affinity: "medium"
      weight: 0.04
    - id: "shopping"
      label: "Shopping / Konsum"
      L2_affinity: "medium-low"
      weight: 0.04

  formality_levels:
    - id: "casual"
      label: "locker"
      cs_modifier: 0.05
    - id: "semi_formal"
      label: "halbformell"
      cs_modifier: 0.0
    - id: "formal"
      label: "formell"
      cs_modifier: -0.10

  dialogue_types:
    - id: "monologue"
      label: "Monolog / Erzählung"
      weight: 0.30
    - id: "dyadic"
      label: "Zwiegespräch"
      weight: 0.45
    - id: "group"
      label: "Gruppengespräch"
      weight: 0.25

  interlocutor_relationships:
    - id: "close_friends"
      label: "enge Freunde"
      default_formality: "casual"
    - id: "colleagues"
      label: "Kollegen"
      default_formality: "semi_formal"
    - id: "classmates"
      label: "Kommilitonen"
      default_formality: "casual"
    - id: "teacher_student"
      label: "Dozent-Student"
      default_formality: "semi_formal"
    - id: "strangers"
      label: "Fremde"
      default_formality: "semi_formal"
    - id: "family"
      label: "Familie"
      default_formality: "casual"
