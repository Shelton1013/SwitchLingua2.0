# ------------------------------------------------------------
# 話題領域語彙 (Topic Domain Words)
# ------------------------------------------------------------
topic_domain_words:

  technology:
    general: ["app", "update", "bug", "server", "code", "data", "software", "system"]
    tech_profession: ["deploy", "debug", "API", "frontend", "backend", "code review", "sprint", "pull request"]

  academic:
    general: ["paper", "research", "project", "presentation", "exam", "professor"]
    academia_profession: ["methodology", "hypothesis", "peer review", "dataset", "literature review", "citation"]

  work:
    general: ["meeting", "deadline", "email", "schedule", "report", "team", "project"]
    marketing_profession: ["campaign", "branding", "content", "pitch", "client", "brief", "KPI"]

  daily_life:
    general: ["weekend", "shopping", "plan", "holiday", "birthday"]

  food:
    general: ["restaurant", "menu", "brunch", "buffet", "dessert", "recipe"]

  emotion:
    general: ["stress", "mood", "relax", "relationship"]

  entertainment:
    general: ["movie", "music", "game", "Netflix", "YouTube", "concert", "drama", "anime"]

  travel:
    general: ["hotel", "airport", "flight", "booking", "check-in", "itinerary"]

  sports:
    general: ["gym", "workout", "fitness", "match", "training"]

  shopping:
    general: ["sale", "discount", "online", "brand", "promotion", "size"]


# ------------------------------------------------------------
# 状況プール (Situation Pools)
# ------------------------------------------------------------
situation_pools:

  topics:
    - id: "technology"
      label: "テクノロジー"
      L2_affinity: "high"
      weight: 0.15
    - id: "academic"
      label: "学術/研究"
      L2_affinity: "high"
      weight: 0.12
    - id: "work"
      label: "仕事/ビジネス"
      L2_affinity: "medium-high"
      weight: 0.15
    - id: "daily_life"
      label: "日常生活"
      L2_affinity: "low"
      weight: 0.15
    - id: "food"
      label: "グルメ/料理"
      L2_affinity: "low"
      weight: 0.08
    - id: "emotion"
      label: "感情/人間関係"
      L2_affinity: "low"
      weight: 0.08
    - id: "entertainment"
      label: "エンタメ/映画/ゲーム"
      L2_affinity: "medium"
      weight: 0.10
    - id: "travel"
      label: "旅行"
      L2_affinity: "medium"
      weight: 0.07
    - id: "sports"
      label: "スポーツ/フィットネス"
      L2_affinity: "medium"
      weight: 0.05
    - id: "shopping"
      label: "ショッピング"
      L2_affinity: "medium-low"
      weight: 0.05

  formality_levels:
