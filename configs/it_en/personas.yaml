# ------------------------------------------------------------
# Topic Domain Words (it-en)
# ------------------------------------------------------------
topic_domain_words:

  technology:
    general: ["app", "update", "bug", "server", "code", "data", "software", "cloud"]
    tech_profession: ["debug", "deploy", "API", "frontend", "backend", "code review", "sprint", "pull request", "framework"]
    engineering_profession: ["design", "prototype", "testing", "simulation", "performance", "benchmark"]

  academic:
    general: ["paper", "research", "project", "presentation", "deadline", "feedback"]
    academia_profession: ["methodology", "peer review", "dataset", "literature review", "citation", "abstract"]

  work:
    general: ["meeting", "deadline", "email", "schedule", "report", "team", "project", "brief"]
    finance_profession: ["portfolio", "revenue", "ROI", "equity", "compliance", "asset management", "trading"]
    media_profession: ["content", "campaign", "brand", "social media", "pitch", "storytelling", "influencer"]
    fashion_profession: ["trend", "brand", "collection", "lookbook", "showroom", "fitting", "buyer", "runway"]

  daily_life:
    general: ["weekend", "shopping", "plan", "holiday", "birthday"]

  food:
    general: ["restaurant", "menu", "brunch", "dessert", "recipe", "spot"]

  emotion:
    general: ["stress", "mood", "relax", "relationship", "burnout"]

  entertainment:
    general: ["movie", "music", "game", "Netflix", "YouTube", "concert", "podcast", "streaming"]

  travel:
    general: ["hotel", "airport", "flight", "booking", "check-in", "itinerary", "Airbnb"]

  sports:
    general: ["gym", "workout", "fitness", "match", "training", "running"]

  shopping:
    general: ["sale", "discount", "online", "brand", "promotion", "outlet"]

  family:
    general: ["family", "home", "kids", "parents"]


# ------------------------------------------------------------
# Situation Pools
# ------------------------------------------------------------
situation_pools:

  topics:
    - id: "technology"
      label: "Tecnologia / Informatica"
      L2_affinity: "high"
      weight: 0.14
    - id: "academic"
      label: "Accademia / Ricerca"
      L2_affinity: "high"
      weight: 0.10
    - id: "work"
      label: "Lavoro / Vita professionale"
      L2_affinity: "medium-high"
      weight: 0.18
    - id: "daily_life"
      label: "Vita quotidiana"
      L2_affinity: "low"
      weight: 0.15
    - id: "food"
      label: "Cibo / Gastronomia"
      L2_affinity: "low"
      weight: 0.09
    - id: "emotion"
      label: "Emozioni / Relazioni"
      L2_affinity: "low"
      weight: 0.07
    - id: "entertainment"
      label: "Intrattenimento / Cultura"
      L2_affinity: "medium"
      weight: 0.12
    - id: "travel"
      label: "Viaggi / In giro"
      L2_affinity: "medium"
      weight: 0.07
    - id: "sports"
      label: "Sport / Fitness"
      L2_affinity: "medium"
      weight: 0.04
    - id: "shopping"
      label: "Shopping / Consumi"
      L2_affinity: "medium-low"
      weight: 0.04

  formality_levels:
    - id: "casual"
      label: "informale"
      cs_modifier: 0.05
    - id: "semi_formal"
      label: "semi-formale"
      cs_modifier: 0.0
    - id: "formal"
      label: "formale"
      cs_modifier: -0.10

  dialogue_types:
    - id: "monologue"
      label: "Monologo / Racconto"
      weight: 0.30
    - id: "dyadic"
      label: "Dialogo a due"
      weight: 0.45
    - id: "group"
      label: "Conversazione di gruppo"
      weight: 0.25

  interlocutor_relationships:
    - id: "close_friends"
      label: "amici stretti"
      default_formality: "casual"
    - id: "colleagues"
      label: "colleghi"
      default_formality: "semi_formal"
    - id: "classmates"
      label: "compagni di corso"
      default_formality: "casual"
    - id: "teacher_student"
      label: "docente-studente"
      default_formality: "semi_formal"
    - id: "strangers"
      label: "sconosciuti"
