  ARC_03: { intra_min: 0.50, min_switch_density: 0.15, desc: "Denso: frequenti alternazioni intrafrastiche" }
  ARC_04: { desc: "Pragmatico: flessibile, nessun vincolo fisso" }
  ARC_05: { max_cmi: 0.15, desc: "Riluttante: CMI deve essere molto basso" }
  ARC_06: { desc: "Accomodamento: adattivo, nessun vincolo fisso" }
  ARC_07: { max_cmi: 0.15, desc: "Backflag: L2-dominante, solo marcatori discorsivi L1, CMI deve essere molto basso" }
