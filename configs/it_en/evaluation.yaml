filler_words: ["cioè", "allora", "praticamente", "tipo", "insomma", "boh", "ma", "vabbè", "comunque", "ecco", "like", "you know", "well", "I mean"]
interjections: ["mamma mia", "boh", "dai", "cavolo", "oh", "eh", "uffa", "basta", "ma"]

l2_span_expectations:
  ARC_01: { typical_max: 3, desc: "di solito 1-3 parole" }
  ARC_02: { typical_min: 4, desc: "di solito una frase intera o una subordinata" }
  ARC_03: { typical_max: 5, desc: "1-5 parole frequenti" }
  ARC_04: { desc: "pragmatico: flessibile, nessun vincolo fisso" }
  ARC_05: { max_cmi: 0.15, desc: "riluttante: CMI deve essere molto basso" }
  ARC_06: { desc: "accomodamento: adattivo, nessun vincolo fisso" }
  ARC_07: { typical_max: 2, desc: "L1 solo come marcatori discorsivi/interiezioni, 1-2 parole" }

switch_type_expectations:
  ARC_01: { intra_min: 0.70, desc: "Insertional: dominato da inserzione intrafrastica" }
