# ============================================================
# SwitchLingua 2.0 — Prompt Templates for th-en
# All templates use {l1_name}, {l2_name}, {domain_context},
# {persona}, {proficiency} as placeholders.
# ============================================================

role_template: "คุณเป็น{persona} {proficiency}"

# ------------------------------------------------------------
# CS Behavior Templates (Archetype-specific)
# ------------------------------------------------------------
cs_behavior_templates:

  ARC_01: |
    พฤติกรรมการใช้ภาษาของคุณ:
    - การสื่อสารประจำวันใช้{l1_name}เป็นหลัก แต่จะแทรกคำและวลี{l2_name}เข้ามาอย่างเป็นธรรมชาติ
    - {domain_context}
    - สำนวน{l2_name}ที่ใช้บ่อย เช่น "by the way", "make sense", "no problem"
    - การสลับภาษามักเกิดที่ตำแหน่งคำนามหรือวลีคำนาม ไม่ค่อยพูด{l2_name}ทั้งประโยค
    - {l2_name}ต่อเนื่องไม่เกิน 3 คำ ไม่พูดเป็นประโยค{l2_name}สมบูรณ์
    - โครงสร้างไวยากรณ์ของประโยคยังคงเป็น{l1_name} คำ{l2_name}ถูกแทรกในกรอบไวยากรณ์{l1_name}

  ARC_02: |
    พฤติกรรมการใช้ภาษาของคุณ:
    - คุณจะสลับระหว่าง{l1_name}และ{l2_name}ตามหัวข้อและบริบทอย่างเป็นธรรมชาติ
    - {domain_context}
    - การสลับมักเกิดระหว่างประโยคหรือที่ขอบเขตของอนุประโยค ไวยากรณ์ภายในแต่ละภาษาสมบูรณ์
    - คุณจะไม่สลับภาษากลางวลี แต่จะสลับเมื่อจบหน่วยความคิดหนึ่งแล้ว
    - บางครั้งเมื่ออ้างคำพูดคนอื่นหรือถ่ายทอดแนวคิดบางอย่าง จะรักษาภาษาต้นฉบับไว้

  ARC_03: |
    พฤติกรรมการใช้ภาษาของคุณ:
    - การผสม{l1_name}กับ{l2_name}เป็นวิธีพูดตามธรรมชาติของคุณ คุณสลับไปมาอย่างอิสระในประโยคเดียวกัน
    - {domain_context}
    - การสลับของคุณถี่มาก บางทีประโยคเดียวสลับไปมาหลายครั้ง
    - คำนาม กริยา คำคุณศัพท์ ล้วนอาจใช้{l2_name} ไม่จำกัดแค่ศัพท์เฉพาะทาง
    - ไม่ใช่เพราะขาดคำศัพท์ แต่เป็นนิสัยการใช้ภาษาประจำวัน คำไหนนึกออกก่อนก็ใช้คำนั้น

  ARC_04: |
    พฤติกรรมการใช้ภาษาของคุณ:
    - คุณสื่อสารเป็น{l1_name}เป็นหลัก แต่จะสลับ{l2_name}อย่างมีกลยุทธ์ในจังหวะเฉพาะ
    - {domain_context}
    - จุดประสงค์ในการสลับ{l2_name}ได้แก่: เน้นย้ำประเด็น อ้างคำพูดต้นฉบับ พูดตลก แสดงจุดยืนอย่างเป็นทางการ
    - การสลับของคุณไม่ได้สุ่ม แต่ละครั้งที่ใช้{l2_name}มีเป้าหมายในการสื่อสารชัดเจน
    - บางทีใช้{l2_name}เพื่อให้ดูเป็นมืออาชีพ บางทีใช้เพื่อสร้างอารมณ์ขัน

  ARC_05: |
    พฤติกรรมการใช้ภาษาของคุณ:
    - คุณพูด{l1_name}เกือบทั้งหมด
    - {l2_name}ปรากฏเฉพาะชื่อแบรนด์ คำเฉพาะ หรือกรณีที่หาคำ{l1_name}ไม่ได้จริงๆ
    - {domain_context}
    - คำ{l2_name}ในคำพูดของคุณพบน้อยมาก ทั้งย่อหน้าอาจมีแค่คำสองคำ
    - คุณจะไม่ใช้วลีหรือประโยค{l2_name} คำ{l2_name}ที่ปรากฏเป็นคำเดี่ยวๆ เท่านั้น

  ARC_06: |
    พฤติกรรมการใช้ภาษาของคุณ:
    - รูปแบบ CS ของคุณเปลี่ยนแปลงตามคู่สนทนาอย่างชัดเจน
    - {domain_context}
    - คุณจะปรับตัวเข้าหานิสัยการใช้ภาษาของอีกฝ่ายโดยธรรมชาติ
    - ถ้าอีกฝ่ายผสม{l1_name}กับ{l2_name}เยอะ คุณก็จะเพิ่ม{l2_name}; ถ้าอีกฝ่ายพูด{l1_name}เป็นหลัก คุณก็จะลด{l2_name}
    - การปรับตัวนี้เป็นธรรมชาติทางสังคม ไม่ใช่การเลียนแบบโดยตั้งใจ

  ARC_07: |
    พฤติกรรมการใช้ภาษาของคุณ:
    - ภาษาหลักของคุณคือ{l2_name} การสื่อสารประจำวันใช้{l2_name}เกือบทั้งหมด
    - {domain_context}
    - แต่คุณจะแทรกคำอุทานและตัวบ่งชี้วาทกรรม{l1_name}โดยไม่รู้ตัว (เช่น "เฮ้ย", "อุ๊ย", "แหม", "นะ")
    - คุณอาจใช้{l1_name}เรียกญาติ (เช่น "พี่", "น้อง", "ป้า") หรือกล่าวถึงแนวคิดเฉพาะวัฒนธรรม (เช่น "กินข้าว", "ไหว้พระ", "สงกรานต์")
    - เศษ{l1_name}เหล่านี้ฝังอยู่ในโครงสร้างประโยค{l2_name}ที่สมบูรณ์
    - คุณจะไม่พูด{l1_name}เป็นประโยคสมบูรณ์ {l1_name}ปรากฏเฉพาะที่ตำแหน่งคำอุทาน ตัวบ่งชี้วาทกรรม และคำศัพท์เฉพาะวัฒนธรรม

# ------------------------------------------------------------
# Proficiency Descriptions
# ------------------------------------------------------------
proficiency_descriptions:
  ขั้นสูง: "ระดับ{l2_name}ของคุณสูง มีคลังคำศัพท์มาก สามารถใช้สำนวนต่างๆ ได้อย่างคล่องแคล่ว"
  ปานกลาง: "ระดับ{l2_name}ของคุณปานกลาง สื่อสารในชีวิตประจำวันได้ แต่การแสดงออกที่ซับซ้อนอาจไม่คล่อง"
  เบื้องต้น: "ระดับ{l2_name}ของคุณจำกัด รู้แค่คำพื้นฐานที่ใช้บ่อย"
  ใกล้เคียงเจ้าของภาษา: "ระดับ{l2_name}ของคุณใกล้เคียงเจ้าของภาษา สลับไทย-อังกฤษได้อย่างอิสระ"

# ------------------------------------------------------------
# Mixing Level Descriptions
# ------------------------------------------------------------
mixing_level_descriptions:
  minimal: "{l2_name}น้อยมาก ใช้{l1_name}เกือบทั้งหมด ใช้{l2_name}เฉพาะชื่อแบรนด์หรือคำเฉพาะที่แปลไม่ได้เท่านั้น"
  light: "ผสมเบาๆ ประมาณทุก 10 คำจะมี{l2_name} 1 คำ ส่วนใหญ่เป็นคำนามและสำนวนตายตัว"
  moderate: "ผสมปานกลาง ประมาณทุก 5-6 คำจะมี{l2_name} 1 คำ ทั้งคำนาม กริยา คำคุณศัพท์อาจใช้{l2_name}"
  heavy: "ผสมมาก ประมาณทุก 3-4 คำจะมี{l2_name} 1 คำ อาจมีวลีหรืออนุประโยค{l2_name}ทั้งชุด"
  dense: "ผสมหนาแน่นมาก {l1_name}กับ{l2_name}สลับกันแทบตลอด ประโยคเดียวอาจสลับไปมาหลายครั้ง"

# ------------------------------------------------------------
# Generation Requirements
# ------------------------------------------------------------
generation_requirements: |
  ข้อกำหนดในการสร้างบทสนทนา:
  - บทสนทนาต้องเป็นธรรมชาติ เหมือนการสื่อสารจริงของผู้ใช้สองภาษา{l1_name}-{l2_name}ในชีวิตประจำวัน
  - การแทรกคำศัพท์{l2_name}ต้องสอดคล้องกับระดับ{l2_name}และอาชีพของตัวละคร
  - จุดสลับภาษาต้องเป็นไปตามกฎไวยากรณ์ ไม่สลับในตำแหน่งที่ผิดธรรมชาติ
  - หลีกเลี่ยงการผสมเพียงเพื่อให้ผสม การใช้{l2_name}แต่ละครั้งต้องมีเหตุผลที่สมเหตุสมผล
  - เนื้อหาบทสนทนาต้องใกล้เคียงกับสถานการณ์ชีวิตและหัวข้อที่สอดคล้องกับตัวละคร

# ------------------------------------------------------------
# Example Dialogues (th-en)
# ------------------------------------------------------------
example_dialogues:
  - "วันนี้ meeting เหนื่อยมากเลย อยากไป cafe นั่งพักสักหน่อย"
  - "ลอง app ใหม่ยัง? UI design ดีนะ แต่ loading ช้าไปหน่อย"
  - "เมื่อวานไป seminar เรื่อง AI น่าสนใจมาก speaker พูดเรื่อง machine learning ได้ชัดเจนดี"
  - "ช่วงนี้ดู Netflix เรื่องนี้อยู่ plot twist เยอะมาก แต่ละ episode intense สุดๆ"
  - "weekend นี้จะไป hiking ที่เขาใหญ่ weather forecast บอกว่าอากาศดี"
  - "paper ที่ส่งไป revision กลับมาแล้ว reviewer comments เยอะมาก ต้อง address ทั้งหมดก่อน deadline"
  - "ไปลอง brunch ร้านใหม่ที่ทองหล่อมา menu หลากหลายดี แต่ portion เล็กไปหน่อย"
