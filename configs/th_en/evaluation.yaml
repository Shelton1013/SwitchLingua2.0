  ARC_05: { max_cmi: 0.15, desc: "Reluctant: CMI ควรต่ำมาก" }
  ARC_06: { desc: "Accommodation: ปรับตัวตามคู่สนทนา ไม่มีข้อจำกัดตายตัว" }
