filler_words: ["อ่า", "เอ่อ", "คือ", "ก็", "แบบ", "อะ", "นะ", "จริงๆ", "ประมาณ", "like", "you know", "well", "I mean", "basically", "right", "actually"]
interjections: ["โอ้", "ว้าว", "เฮ้ย", "อุ๊ย", "แหม", "โอ๊ย", "เอ๊ะ", "อ้าว"]

l2_span_expectations:
