# ------------------------------------------------------------
# Topic Domain Words
# Decoupled from profession, organized by topic
# ------------------------------------------------------------
topic_domain_words:

  technology:
    general: ["app", "update", "bug", "server", "code", "data", "software", "system", "online"]
    tech_profession: ["debug", "deploy", "API", "frontend", "backend", "code review", "sprint", "pull request", "cloud"]

  academic:
    general: ["paper", "research", "project", "presentation", "exam", "professor", "lecture"]
    academia_profession: ["methodology", "hypothesis", "peer review", "dataset", "literature review", "citation", "thesis"]

  work:
    general: ["meeting", "deadline", "email", "schedule", "report", "team", "project", "KPI", "feedback"]
    finance_profession: ["portfolio", "revenue", "ROI", "equity", "compliance", "quarter", "investment"]
    media_profession: ["campaign", "branding", "content", "pitch", "client", "brief", "influencer"]

  daily_life:
    general: ["weekend", "shopping", "plan", "holiday", "birthday", "condo", "BTS", "traffic"]

  food:
    general: ["restaurant", "menu", "brunch", "buffet", "dessert", "recipe", "cafe", "delivery"]

  emotion:
    general: ["stress", "mood", "relax", "relationship", "happy", "mental health"]

  entertainment:
    general: ["movie", "music", "game", "Netflix", "YouTube", "concert", "drama", "series"]

  travel:
    general: ["hotel", "airport", "flight", "booking", "check-in", "itinerary", "resort"]

  sports:
    general: ["gym", "workout", "fitness", "match", "training", "yoga", "run"]

  shopping:
    general: ["sale", "discount", "online", "brand", "promotion", "size", "limited edition"]


# ------------------------------------------------------------
# Situation Pools
# Topics, formality, dialogue types, relationships
# Sampling is constrained by persona templates
# ------------------------------------------------------------
situation_pools:

  topics:
    - id: "technology"
      label: "เทคโนโลยี/โปรแกรมมิ่ง"
      L2_affinity: "high"
      weight: 0.15
    - id: "academic"
      label: "วิชาการ/การวิจัย"
      L2_affinity: "high"
      weight: 0.10
    - id: "work"
      label: "งาน/อาชีพ"
      L2_affinity: "medium-high"
      weight: 0.15
    - id: "daily_life"
      label: "ชีวิตประจำวัน"
      L2_affinity: "low"
      weight: 0.15
    - id: "food"
      label: "อาหาร/ร้านอาหาร"
      L2_affinity: "low"
      weight: 0.10
    - id: "emotion"
      label: "ความรู้สึก/ความสัมพันธ์"
      L2_affinity: "low"
      weight: 0.07
    - id: "entertainment"
      label: "บันเทิง/หนัง/เกม"
      L2_affinity: "medium"
      weight: 0.10
    - id: "travel"
      label: "ท่องเที่ยว/การเดินทาง"
      L2_affinity: "medium"
      weight: 0.07
    - id: "sports"
      label: "กีฬา/ออกกำลังกาย"
      L2_affinity: "medium"
      weight: 0.05
    - id: "shopping"
      label: "ช้อปปิ้ง/การซื้อของ"
      L2_affinity: "medium-low"
      weight: 0.06

  formality_levels:
    - id: "casual"
      label: "สบายๆ"
      cs_modifier: 0.05
    - id: "semi_formal"
      label: "กึ่งทางการ"
      cs_modifier: 0.0
    - id: "formal"
      label: "ทางการ"
      cs_modifier: -0.10

  dialogue_types:
    - id: "monologue"
      label: "พูดคนเดียว/เล่าเรื่อง"
      weight: 0.30
    - id: "dyadic"
      label: "สนทนาสองคน"
      weight: 0.45
    - id: "group"
      label: "คุยกันหลายคน"
      weight: 0.25

  interlocutor_relationships:
    - id: "close_friends"
      label: "เพื่อนสนิท"
      default_formality: "casual"
    - id: "colleagues"
      label: "เพื่อนร่วมงาน"
      default_formality: "semi_formal"
    - id: "classmates"
      label: "เพื่อนร่วมชั้น"
      default_formality: "casual"
    - id: "teacher_student"
      label: "อาจารย์-ลูกศิษย์"
      default_formality: "semi_formal"
    - id: "strangers"
      label: "คนแปลกหน้า"
      default_formality: "semi_formal"
    - id: "family"
      label: "ครอบครัว"
      default_formality: "casual"
