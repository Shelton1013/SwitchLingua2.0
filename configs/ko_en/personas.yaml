# ============================================================
# SwitchLingua 2.0 — 인물 템플릿 풀 및 상황 풀 (Layer 3 샘플링 소스)
# v2: Persona Templates로 독립 차원 샘플링을 대체하여 교차 차원 일관성 보장
# ============================================================

# ------------------------------------------------------------
# 인물 템플릿 풀 (Persona Templates)
# 각 템플릿은 합리적인 인물 조합이며, 내부 차원은 사전 조율됨
# 제약 관계:
#   - 지역 × L2 수준: 해당 지역의 전형적인 영어 환경에 부합
#   - 나이 × 직업: 인생 단계에 부합
#   - L2 수준 × 호환 아키타입: 언어 능력이 해당 CS 모드를 지원
#   - 인물 × 가용 관계: 사회적 장면에 부합
# ------------------------------------------------------------
persona_templates:

