# ------------------------------------------------------------
# 화제 영역 어휘 (Topic Domain Words)
# 직업에서 분리하여 화제별로 구성 — 직업에 관계없이
# 특정 화제를 이야기할 때 관련 영어 단어를 사용
# ------------------------------------------------------------
topic_domain_words:

  technology:
    general: ["app", "update", "bug", "server", "code", "data", "software", "system", "AI", "cloud"]
    tech_profession: ["debug", "deploy", "API", "frontend", "backend", "code review", "sprint", "pull request", "release", "agile"]

  academic:
    general: ["paper", "research", "project", "presentation", "exam", "professor", "thesis"]
    academia_profession: ["methodology", "hypothesis", "peer review", "dataset", "literature review", "citation", "conference"]

  work:
    general: ["meeting", "deadline", "email", "schedule", "report", "team", "project", "feedback"]
    marketing_profession: ["campaign", "branding", "content", "target", "KPI", "ROI", "engagement", "conversion"]
    startup_profession: ["pitch", "funding", "MVP", "pivot", "scaling", "equity", "valuation"]

  daily_life:
    general: ["weekend", "shopping", "plan", "holiday", "birthday", "schedule"]

  food:
    general: ["restaurant", "menu", "brunch", "buffet", "dessert", "recipe", "delivery", "review"]

  emotion:
    general: ["stress", "mood", "relax", "relationship", "mental health"]

  entertainment:
    general: ["movie", "music", "game", "Netflix", "YouTube", "concert", "drama", "streaming"]

  kpop_culture:
    general: ["comeback", "debut", "fandom", "bias", "lightstick", "album", "concept", "visual", "idol", "trainee"]
    entertainment_profession: ["choreography", "vocal", "rap", "stage", "performance", "MV", "teaser", "tracklist"]

  travel:
    general: ["hotel", "airport", "flight", "booking", "check-in", "itinerary", "trip"]

  sports:
    general: ["gym", "workout", "fitness", "match", "training", "pilates", "yoga"]

  shopping:
    general: ["sale", "discount", "online", "brand", "promotion", "size", "review", "coupon"]


# ------------------------------------------------------------
# 상황 풀 (Situation Pools)
# 화제, 격식도, 대화 유형, 관계가 정의됨
# 샘플링 시 persona template의 제약을 받음
# ------------------------------------------------------------
situation_pools:

  topics:
    - id: "technology"
      label: "기술/프로그래밍"
      L2_affinity: "high"
      weight: 0.13
    - id: "academic"
      label: "학업/연구"
      L2_affinity: "high"
      weight: 0.10
    - id: "work"
      label: "직장/업무"
      L2_affinity: "medium-high"
      weight: 0.14
    - id: "daily_life"
      label: "일상생활"
      L2_affinity: "low"
      weight: 0.14
    - id: "food"
      label: "음식/맛집"
      L2_affinity: "low"
      weight: 0.08
    - id: "emotion"
      label: "감정/관계"
      L2_affinity: "low"
      weight: 0.06
    - id: "entertainment"
      label: "엔터테인먼트/미디어"
      L2_affinity: "medium"
      weight: 0.10
    - id: "kpop_culture"
      label: "K-pop/한류 문화"
      L2_affinity: "high"
      weight: 0.08
    - id: "travel"
      label: "여행"
      L2_affinity: "medium"
      weight: 0.07
    - id: "sports"
      label: "운동/건강"
      L2_affinity: "medium"
      weight: 0.05
    - id: "shopping"
      label: "쇼핑/소비"
      L2_affinity: "medium-low"
      weight: 0.05

  formality_levels:
    - id: "casual"
      label: "반말 (편한 사이)"
      cs_modifier: 0.05
    - id: "semi_formal"
      label: "존댓말 (일반적)"
      cs_modifier: 0.0
    - id: "formal"
      label: "격식체 (공식적)"
      cs_modifier: -0.10

  dialogue_types:
    - id: "monologue"
      label: "독백/서술"
      weight: 0.30
    - id: "dyadic"
      label: "2인 대화"
      weight: 0.45
    - id: "group"
      label: "다인 대화"
      weight: 0.25

  interlocutor_relationships:
    - id: "close_friends"
      label: "친한 친구"
      default_formality: "casual"
    - id: "colleagues"
      label: "동료"
      default_formality: "semi_formal"
    - id: "classmates"
      label: "동기/학우"
      default_formality: "casual"
    - id: "teacher_student"
      label: "사제 관계"
      default_formality: "semi_formal"
    - id: "strangers"
      label: "낯선 사람"
      default_formality: "semi_formal"
    - id: "family"
      label: "가족"
      default_formality: "casual"
