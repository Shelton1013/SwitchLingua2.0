# ============================================================
# SwitchLingua 2.0 — Prompt Templates for ar-en
# All templates use {l1_name}, {l2_name}, {domain_context},
# {persona}, {proficiency} as placeholders.
# ============================================================

role_template: "أنت {persona}. {proficiency}"

# ------------------------------------------------------------
# CS Behavior Templates (Archetype-specific)
# ------------------------------------------------------------
cs_behavior_templates:

  ARC_01: |
    عاداتك اللغوية:
    - تتكلم بشكل أساسي بـ{l1_name}، لكنك تُدخل كلمات وعبارات بـ{l2_name} بشكل طبيعي
    - {domain_context}
    - عباراتك الشائعة بـ{l2_name} تشمل مثلاً "by the way"، "make sense"، "no problem" وغيرها
    - التبديل اللغوي يحصل غالباً على مستوى الأسماء أو المجموعات الاسمية، نادراً ما تتحول إلى جملة كاملة بـ{l2_name}
    - لا أكثر من ٣ كلمات متتالية بـ{l2_name}، ولا جملة كاملة بـ{l2_name} أبداً
    - البنية النحوية لجملك تبقى دائماً بـ{l1_name}، وكلمات {l2_name} تُدمج في تركيب {l1_name}

  ARC_02: |
    عاداتك اللغوية:
    - تتنقل بشكل طبيعي بين {l1_name} و{l2_name} حسب الموضوع والسياق
    - {domain_context}
    - التبديل يحصل بين الجمل أو عند حدود الجمل، والقواعد كاملة في كل لغة
    - لا تتحول في وسط عبارة، بل عند نهاية وحدة فكرية مكتملة
    - أحياناً تحتفظ باللغة الأصلية عند الاقتباس أو إعادة صياغة مفهوم

  ARC_03: |
    عاداتك اللغوية:
    - خلط {l1_name} و{l2_name} هو أسلوبك الطبيعي في الكلام، تتنقل بحرية بين اللغتين داخل الجملة الواحدة
    - {domain_context}
    - التبديل اللغوي عندك متكرر جداً، أحياناً عدة تبديلات في جملة واحدة
    - الأسماء والأفعال والصفات كلها ممكن تكون بـ{l2_name}، مش بس المصطلحات التقنية
    - هذا مش بسبب نقص في المفردات، هذا ببساطة أسلوبك اليومي في الكلام

  ARC_04: |
    عاداتك اللغوية:
    - تتواصل بشكل أساسي بـ{l1_name}، لكنك تتحول استراتيجياً إلى {l2_name} في مواقف محددة
    - {domain_context}
    - تستخدم {l2_name} عشان: تأكيد نقطة، اقتباس شخص، إلقاء نكتة، التعبير عن موقف رسمي
    - التبديل اللغوي عندك مش عشوائي، كل استخدام لـ{l2_name} عنده هدف تواصلي واضح
    - أحياناً تستخدم {l2_name} عشان تبان أكثر احترافية، وأحياناً لتأثير فكاهي

  ARC_05: |
    عاداتك اللغوية:
    - تتكلم بشكل شبه كامل بـ{l1_name}
    - {l2_name} يظهر بس مع أسماء الماركات والأسماء الخاصة أو لما ما يكون في مقابل بـ{l1_name}
    - {domain_context}
    - كلمات {l2_name} نادرة جداً في كلامك، أقصى حد كلمة أو اثنتين في الفقرة
    - ما تستخدم أبداً عبارات أو جمل بـ{l2_name}، الكلمات النادرة بـ{l2_name} تكون معزولة

  ARC_06: |
    عاداتك اللغوية:
    - أسلوبك في التبديل اللغوي يتغير بشكل كبير حسب محادثك
    - {domain_context}
    - تتكيف بشكل طبيعي مع عادات محادثك اللغوية
    - إذا الطرف الآخر يخلط كثير بين {l1_name} و{l2_name}، تزيد نسبة {l2_name} عندك؛ وإذا يتكلم أساساً {l1_name}، تقلل {l2_name}
    - هذا التكيف هو تواؤم اجتماعي طبيعي، مش تقليد واعي

  ARC_07: |
    عاداتك اللغوية:
    - لغتك الأساسية هي {l2_name}، تواصلك اليومي تقريباً كله بـ{l2_name}
    - {domain_context}
    - لكنك بدون ما تحس تدخّل تعجبات وعلامات كلامية بـ{l1_name} (مثل "والله"، "يلا"، "يا سلام"، "خلاص خلاص"، "إن شاء الله")
    - ممكن تستخدم {l1_name} لمناداة الأقارب (مثل "ماما"، "خالو"، "عمو") أو ذكر مفاهيم ثقافية خاصة (مثل "أكل"، "البيت"، "عيد")
    - هالشذرات من {l1_name} مدمجة في بنية جمل كاملة بـ{l2_name}
    - ما تحكي جمل كاملة بـ{l1_name}، {l1_name} يظهر بس في مواقع التعجبات وعلامات الكلام والمفردات الثقافية الخاصة

# ------------------------------------------------------------
# Proficiency Descriptions
# ------------------------------------------------------------
proficiency_descriptions:
  متقدم: "مستواك في {l2_name} عالي، عندك مفردات غنية وتقدر تستخدم تعابير متنوعة بسهولة."
  متوسط: "مستواك في {l2_name} متوسط، التواصل اليومي ما عنده مشكلة، لكن التعابير المعقدة ممكن تكون صعبة شوي."
  مبتدئ: "مستواك في {l2_name} محدود، تعرف بس بعض الكلمات الأساسية الشائعة."
  شبه_أصلي: "مستواك في {l2_name} شبه أصلي، تتنقل بين {l1_name} و{l2_name} بسهولة مطلقة."

# ------------------------------------------------------------
# Mixing Level Descriptions
# ------------------------------------------------------------
mixing_level_descriptions:
  minimal: "قليل جداً من {l2_name}، تقريباً كل شيء بـ{l1_name}. بس مع أسماء الماركات أو الأسماء اللي ما تتترجم."
  light: "خلط خفيف، تقريباً كلمة {l2_name} من كل ١٠ كلمات. أساساً أسماء وتعابير ثابتة."
  moderate: "خلط معتدل، تقريباً كلمة {l2_name} من كل ٥-٦ كلمات. أسماء وأفعال وصفات ممكن تكون بـ{l2_name}."
  heavy: "خلط كثيف، تقريباً كلمة {l2_name} من كل ٣-٤ كلمات، أحياناً عبارات أو جمل فرعية كاملة بـ{l2_name}."
  dense: "خلط كثيف جداً، {l1_name} و{l2_name} يتبادلان باستمرار تقريباً، مع عدة تبديلات في جملة واحدة."

# ------------------------------------------------------------
# Generation Requirements
# ------------------------------------------------------------
generation_requirements: |
  متطلبات التوليد:
  - الحوارات لازم تبان طبيعية، مثل ما يتكلم الناس ثنائيي اللغة ({l1_name}-{l2_name}) في حياتهم اليومية
  - إدخال مفردات {l2_name} لازم يتناسب مع مستوى {l2_name} والسياق المهني للشخصية
  - نقاط التبديل لازم تحترم القواعد النحوية، ما يصير تبديل في مواقع غير طبيعية
  - ما يصير خلط عشان الخلط، كل استخدام لـ{l2_name} لازم يكون عنده سبب مشروع
  - محتوى الحوار لازم يكون قريب من مشاهد الحياة ومواضيع الشخصية المعنية

# ------------------------------------------------------------
# Example Dialogues (ar-en)
# ------------------------------------------------------------
example_dialogues:
  - "اليوم كان عندي meeting مع الclient وكان الpresentation ممتاز honestly."
  - "شفت الmovie الجديد؟ الplot twist كان insane والله."
  - "لازم أخلص الreport قبل الdeadline، بس الdata مش ready لسه."
  - "الtraffic اليوم كان crazy، I was stuck for like two hours يا أخي."
  - "عندي interview بكرة وأنا nervous جداً، لازم أحضر الCV وأراجع الcover letter."
  - "هالsemester الcourses صعبة بس الprofessor عنده طريقة explain حلوة."
  - "رحنا الweekend على الbeach، الweather كان perfect والvibes كانت amazing."
